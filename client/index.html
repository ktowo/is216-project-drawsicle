<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- The popsicle logo everywhere: tabs, bookmarks, phone home screens -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/drawsicle.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Drawsicle runs art exchange events: sign-ups, character references, automatic matching and deadlines in one place.">
    <meta name="theme-color" content="#faf7f0">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Drawsicle">
    <meta property="og:title" content="Drawsicle: art exchanges made easy">
    <meta property="og:description" content="Run Secret Santas, Valentine swaps and seasonal art exchanges with sign-ups, matching and deadlines in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without holding up the first paint (system fonts show until they arrive) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <title>Drawsicle</title>
    <script>
      // Pick light/dark before the page paints, so there's no flash of the wrong theme
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('drawsicle-preferences') || '{}');
          var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="max-width: 36rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.6">
        Drawsicle needs JavaScript to run. Please turn it on in your browser settings and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
